<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-96 p-6 rounded-2xl shadow-xl">

        <!-- Title -->
        <h1 class="text-2xl font-bold text-center mb-6">
            Basic Calculator
        </h1>

        <!-- Display -->
        <div
            id="display"
            class="bg-gray-900 text-white text-right text-3xl p-4 rounded-lg mb-5"
        >
            0
        </div>

        <!-- Buttons -->
        <div class="grid grid-cols-4 gap-3">

            <!-- Clear + Divide -->
            <button
                id="clear"
                class="col-span-3 bg-red-500 text-white p-4 rounded-lg text-xl font-bold hover:bg-red-600"
            >
                C
            </button>

            <button
                id="divide"
                class="bg-blue-500 text-white p-4 rounded-lg text-xl font-bold hover:bg-blue-600"
            >
                /
            </button>

            <!-- 7 8 9 * -->
            <button
                id="seven"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                7
            </button>

            <button
                id="eight"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                8
            </button>

            <button
                id="nine"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                9
            </button>

            <button
                id="multiply"
                class="bg-blue-500 text-white p-4 rounded-lg text-xl font-bold hover:bg-blue-600"
            >
                *
            </button>

            <!-- 4 5 6 - -->
            <button
                id="four"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                4
            </button>

            <button
                id="five"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                5
            </button>

            <button
                id="six"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                6
            </button>

            <button
                id="subtract"
                class="bg-blue-500 text-white p-4 rounded-lg text-xl font-bold hover:bg-blue-600"
            >
                -
            </button>

            <!-- 1 2 3 + -->
            <button
                id="one"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                1
            </button>

            <button
                id="two"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                2
            </button>

            <button
                id="three"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                3
            </button>

            <button
                id="add"
                class="bg-blue-500 text-white p-4 rounded-lg text-xl font-bold hover:bg-blue-600"
            >
                +
            </button>

            <!-- 0 . = -->
            <button
                id="zero"
                class="col-span-2 bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                0
            </button>

            <button
                id="decimal"
                class="bg-gray-200 p-4 rounded-lg text-xl font-bold hover:bg-gray-300"
            >
                .
            </button>

            <button
                id="equals"
                class="bg-green-500 text-white p-4 rounded-lg text-xl font-bold hover:bg-green-600"
            >
                =
            </button>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
